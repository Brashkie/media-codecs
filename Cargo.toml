[workspace]
resolver = "2"
members = ["crates/codecs-core", "crates/codecs-node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
authors = ["Brashkie <dev@brashkie.dev>"]
repository = "https://github.com/Brashkie/media-codecs"
homepage = "https://kryx.dev"

[workspace.dependencies]
# Core async + utility
tokio = { version = "1.40", features = ["sync", "rt", "macros", "io-util"] }
async-trait = "0.1"
bytes = "1.7"
parking_lot = "0.12"
arc-swap = "1.7"
thiserror = "1.0"
anyhow = "1.0"
bitflags = "2.6"
once_cell = "1.20"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Numeric / SIMD-friendly
bytemuck = { version = "1.18", features = ["derive"] }
half = "2.4"

# NAPI
napi = { version = "2", default-features = false, features = ["napi8", "async", "serde-json"] }
napi-derive = "2"
napi-build = "2"

# Internal
mcd-core = { path = "crates/codecs-core", version = "0.1.0" }

# Cross-package
media-core = "0.1.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false

[profile.bench]
opt-level = 3
lto = "fat"
debug = true
